spring.config.import=optional:file:.env[dotenv]

server.port=${PORT:8083}
spring.application.name=analytics-service

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:gerai_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/gerai}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

app.reports.output-dir=${REPORTS_EXPORT_DIR:C:/gerai/exports/analytics}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=on_param

logging.level.org.springframework.security=DEBUG