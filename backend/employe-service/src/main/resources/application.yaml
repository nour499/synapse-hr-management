spring:
  config:
    import: "optional:file:.env[dotenv]"
  profiles:
    active: dev

  application:
    name: grh-backend

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URI:http://localhost:8080/realms/gerai}
          jwk-set-uri: ${KC_JWK_URI:http://localhost:8080/realms/gerai/protocol/openid-connect/certs}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.OracleDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

keycloak:
  server-url: ${KC_SERVER_URL:http://localhost:8080}
  realm: master
  admin-realm: master
  admin-client-id: admin-cli
  admin-username: ${KC_ADMIN_USERNAME:admin}
  admin-password: ${KC_ADMIN_PASSWORD:admin}
  target-realm: ${KC_TARGET_REALM:gerai}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  upload:
    dir: ${FILE_UPLOAD_DIR:C:/gerai/uploads/employe}
  kafka:
    topic:
      notifications: ${KAFKA_TOPIC_NOTIFICATIONS:notification-events}
  analytics-service:
    url: ${ANALYTICS_SERVICE_URL:http://localhost:8083}

server:
  port: 8081
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true